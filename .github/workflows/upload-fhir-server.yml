name: Build IG and upload resources to FHIR server

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Repository variable / secret
  FHIR_SERVER_URL: ${{ vars.FHIR_SERVER_URL }}      # e.g. https://hapi.example.org/fhir
  FHIR_SERVER_TOKEN: ${{ secrets.FHIR_SERVER_TOKEN }} # optional

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g fsh-sushi
      - run: |
          sudo apt-get update && sudo apt-get install -y ruby-full build-essential jq
          sudo gem install jekyll
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar
      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig .
      - name: Upload IG output and QA report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output
      - name: Upload profiles, extensions, terminology and examples
        run: python3 scripts/upload_to_fhir_server.py output 50
