name: Build IG and deploy to server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Repository variables (Settings > Secrets and variables > Actions > Variables)
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}   # e.g. /var/www/html/obs-neonat-ig

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Jekyll
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install jekyll

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig .

      - name: Check output
        run: |
          test -f output/index.html
          test -f output/qa.html && echo "QA report present"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy IG (includes qa.html report)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p $DEPLOY_PORT" \
            output/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Upload build output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output
